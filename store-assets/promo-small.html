<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>promo-small</title>
<style>
  /* 440×280 small promo tile. Same gradient stage and inset-card language as
     the screenshot, scaled down. Outline colour is content.js rgb(76,175,80). */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:440px;height:280px;overflow:hidden}
  body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    color:#16181d}

  .stage{width:440px;height:280px;
    background:linear-gradient(152deg,#f4f6f9 0%,#e8ecf2 55%,#dee4ed 100%);
    display:flex;align-items:center;gap:18px;padding:0 24px}

  .left{width:174px;flex:none}
  .mark{display:flex;align-items:center;gap:9px;margin-bottom:13px}
  .mark img{width:31px;height:31px;display:block}
  .mark span{font-size:29px;font-weight:700;letter-spacing:-.9px;color:#14161a}

  .lede{font-size:14.5px;font-weight:600;line-height:1.32;color:#20242c;letter-spacing:-.15px}
  .sub{font-size:11.5px;color:#6b7079;margin-top:9px;line-height:1.4}

  .card{width:206px;height:172px;background:#fff;border-radius:10px;flex:none;
    box-shadow:0 12px 30px rgba(20,26,40,.19),0 2px 6px rgba(20,26,40,.10);
    padding:9px;position:relative}
  .ph{width:100%;height:100%;border-radius:5px;object-fit:cover;display:block;
    border:2px solid rgb(76,175,80);box-shadow:0 0 0 6px rgba(76,175,80,.28)}
  .chip{position:absolute;right:16px;bottom:16px;background:rgba(0,0,0,.9);color:#fff;
    padding:5px 9px;border-radius:5px;font-size:10px;font-weight:500;white-space:nowrap;
    box-shadow:0 3px 9px rgba(0,0,0,.4)}
</style></head>
<body>
<div class="stage">
  <div class="left">
    <div class="mark">
      <img src="icon-mark.png" alt="">
      <span>Nab</span>
    </div>
    <div class="lede">Click and drag any image. It downloads.</div>
    <div class="sub">Built for social media managers.</div>
  </div>
  <div class="card">
    <img class="ph" src="p1.jpg" alt="">
    <div class="chip">✓ north-coast-03.jpg</div>
  </div>
</div>
</body></html>
